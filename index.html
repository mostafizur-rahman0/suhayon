<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUHAYON — Official Website</title>
<meta name="description" content="SUHAYON (সুহায়ন) is a youth-led voluntary social organization in Kishoreganj, Bangladesh. Education • Unity • Humanity.">

<meta property="og:image" content="logo.jpg">

<style>
:root{--y:#FDE506;--yd:#E9C900;--n:#0B1B5C;--ink:#16203D;--mut:#4A5470;--g:#F4F5F9;--line:#E1E4EE;--w:1080px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.7 "Hind Siliguri",system-ui,sans-serif;color:var(--ink);background:#fff}
a{color:var(--n)}
:focus-visible{outline:3px solid var(--n);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:9}
.wrap{max-width:var(--w);margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--y)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
header img{height:44px;width:auto;display:block}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px}
nav a{display:block;padding:6px 10px;border-radius:6px;text-decoration:none;font-size:15px;font-weight:600}
nav a:hover,nav a[aria-current]{background:var(--y)}
#mb{display:none;background:var(--n);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit}
@media(max-width:900px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:3px solid var(--y);padding:8px 18px}nav.open{display:block}nav ul{flex-direction:column}}
.hero{background:var(--y);padding:44px 0 56px}
.hero .wrap{display:grid;gap:26px;align-items:center}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.1fr 1fr}}
.hero img{width:100%;max-width:520px;height:auto;mix-blend-mode:multiply}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:0 0 8px;color:var(--n)}
.motto{font-weight:600;letter-spacing:.5px;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-block;padding:11px 20px;border-radius:8px;font-weight:600;text-decoration:none;background:var(--n);color:#fff;border:2px solid var(--n)}
.btn.o{background:transparent;color:var(--n)}
.btn:hover{transform:translateY(-2px)}
.ph{background:var(--n);color:#fff;padding:34px 0;border-bottom:6px solid var(--y)}
.ph h1{margin:0;font-size:clamp(26px,4.5vw,38px)}.ph p{margin:6px 0 0;max-width:46em;opacity:.9}
section.wrap{padding-top:34px;padding-bottom:10px}
h2{font-size:24px;color:var(--n);margin:0 0 12px;padding-left:12px;border-left:6px solid var(--y)}
h3{margin:0 0 4px;font-size:18px;color:var(--n)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--g);border:1px solid var(--line);border-top:4px solid var(--y);border-radius:8px;padding:14px 16px}
.card small,.muted{color:var(--mut)}
.stat{font-size:32px;font-weight:600;color:var(--n);line-height:1.1}
.chip{display:inline-block;background:var(--y);color:var(--n);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:600;margin-right:6px}
ol.obj{padding-left:22px}ol.obj li{margin:4px 0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:480px}
th{background:var(--n);color:#fff;text-align:left}
th,td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:var(--g)}
.info{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:0 0 18px}
.info div{background:var(--y);border-radius:8px;padding:10px 14px}.info b{display:block;font-size:13px;color:var(--n)}
.chart{text-align:center;max-width:560px;margin:8px auto}
.node{border-radius:10px;padding:14px;font-weight:600}.node small{display:block;font-weight:400}
.n1{background:var(--n);color:#fff}.n2{background:var(--y);color:var(--n)}
.arrow{padding:8px;color:var(--mut);font-size:14px}
.ph-img{background:repeating-linear-gradient(45deg,var(--g),var(--g) 10px,#fff 10px,#fff 20px);border:1px dashed #b9bfd2;border-radius:8px;aspect-ratio:4/3;display:grid;place-items:center;color:var(--mut);font-size:14px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
form{display:grid;gap:10px;max-width:520px}
label{font-weight:600;font-size:14px}
input,textarea{width:100%;padding:10px;border:1px solid #b9bfd2;border-radius:8px;font:inherit}
.note{background:#FFF9C7;border-left:5px solid var(--yd);padding:10px 14px;border-radius:6px;margin:14px 0}
footer{background:var(--n);color:#e8ebf7;margin-top:46px;border-top:6px solid var(--y)}
footer .wrap{padding-top:28px;padding-bottom:22px;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
footer a{color:#fff}footer h3{color:var(--y)}footer ul{list-style:none;padding:0;margin:0;columns:2}
.copy{grid-column:1/-1;border-top:1px solid #2b3b7d;padding-top:12px;font-size:14px}
@media(prefers-reduced-motion:reduce){.btn:hover{transform:none}}

.lang{border:2px solid var(--n);background:#fff;color:var(--n);border-radius:99px;padding:4px 12px;font:600 14px "Hind Siliguri",sans-serif;cursor:pointer}
.tools{display:flex;align-items:center;gap:8px}
.don{background:var(--n);color:#fff!important;border-radius:99px;padding:6px 14px;font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap}
.join{background:var(--y);color:var(--n)!important;border-radius:99px;padding:6px 14px;font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap;border:2px solid var(--n)}
.fab{position:fixed;right:14px;bottom:14px;z-index:6;box-shadow:0 4px 14px #0005;padding:12px 20px;font-size:16px}
@media(min-width:900px){.fab{display:none}}
@media(max-width:560px){.join{display:none}header img{height:38px}}
.pcard{background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--y);border-radius:12px;overflow:hidden}
.ph3{position:relative;aspect-ratio:3/4;background:var(--y);display:grid;place-items:center;font-size:56px;color:var(--n);font-weight:600}
.ph3 img,.act img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pb{padding:10px 12px}.pb h3{margin:0}
.grid.p{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.act{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--g)}
.act .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;color:#fff;background:linear-gradient(transparent,#000b)}
.act .cap h3{color:#fff;margin:2px 0}.act .cap p{margin:2px 0 0;font-size:14px}
.grid.a{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.band{background:var(--y);border-radius:12px;padding:20px 22px;margin:8px 0}
.band h3{font-size:22px;margin:0}
.num{display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:8px;padding:6px 8px 6px 12px;margin:4px 6px 4px 0}
.num .lang{padding:2px 10px;font-size:13px}
</style>
</head>

const tiles=n=>`<div class="grid a">${G.slice(0,n).map(g=>`<div class="ph-img">${g[L==='bn'?1:0]}</div>`).join('')}</div>`;
const nums=()=>{const o=S.donate||{};return [['bKash',o.bkash],['Nagad',o.nagad]].filter(x=>x[1]).map(x=>`<span class="num">${x[0]}: <b>${h(x[1])}</b> <button class="lang" data-c="${h(x[1])}">${d('copy')}</button></span>`).join('')||`<p>${d('soon')}</p>`};
const band=()=>`<div class="band"><h3>${d('dT')}</h3><p>${d('dX')}</p><div>${nums()}</div><div class="btns"><a class="btn" href="#/donate">${d('dM')}</a></div></div>`;
const joinBand=()=>`<div class="band" style="background:var(--n);color:#fff"><h3 style="color:var(--y)">${d('jT')}</h3><p>${d('jX')}</p><a class="btn" style="background:var(--y);color:var(--n);border-color:var(--y)" href="${h(S.joinUrl)}" target="_blank" rel="noopener">${d('join')}</a></div>`;
const C=S.committee;
const info=()=>`<div class="info"><div><b>${d('iT')}</b>${h(C.term)}</div><div><b>${d('iM')}</b>${h(C.meeting)}</div><div><b>${d('iV')}</b>${h(T(C.venue))}</div><div><b>${d('iA')}</b>${h(T(C.authority))}</div><div><b>${d('iR')}</b>${h(T(C.memo))}</div></div>`;
const cards=()=>`<p class="muted">${d('dup')}</p><div class="grid p">${C.members.map(m=>pcard(m[3]||`m${m[0]}.jpg`,T(m[1]),m[2])).join('')}</div>`;
const R={
home:()=>`<div class="hero"><div class="wrap"><div><h1>${h(S.name)} — ${h(S.bn)}</h1><p class="motto">${h(T(S.motto))}</p><p><b>${h(T(S.slogan))}</b></p><p>${h(T(S.intro))}</p><div class="btns"><a class="btn" href="${h(S.joinUrl)}" target="_blank" rel="noopener">${d('join')}</a><a class="btn" style="background:#fff;color:var(--n)" href="#/donate">${d('donate')}</a><a class="btn o" href="#/about">${d('learn')}</a><a class="btn o" href="#/executive">${d('meet')}</a></div></div><img src="logo.jpg" alt="সুহায়ন logo"></div></div>`
 +sec(d('hAct'),S.activities.length?`<div class="grid a">${S.activities.slice(0,6).map(act).join('')}</div><p><a href="#/activities">${d('activities')} →</a></p>`:note(d('actEmpty'))+tiles(3))
 +`<section class="wrap">${band()}</section>`
 +sec(d('hPrin'),`<div class="grid">${S.principles.map(p=>`<div class="card"><h3>${h(T(p))}</h3></div>`).join('')}</div>`)
 +sec(d('hInit'),`<div class="grid">${S.categories.map(c=>`<div class="card"><h3>${h(T(c))}</h3></div>`).join('')}</div>`)
 +sec(d('hGl'),`<div class="grid"><div class="card"><div class="stat">${C.members.length}</div>${d('pos')}</div><div class="card"><div class="stat">${d('y2')}</div>${d('termL')}</div><div class="card"><div class="stat">${S.principles.length}</div>${d('prin')}</div></div>`)
 +sec(d('hAnn'),S.announcements.length?`<div class="grid">${S.announcements.slice(0,3).map(a=>`<div class="card"><small>${when(a.date)}</small><h3>${h(T(a.title))}</h3>${h(T(a.text))}</div>`).join('')}</div>`:note(d('noAnn')))
 +`<section class="wrap">${joinBand()}</section>`
 +sec(d('hOrg'),chart()),
about:()=>pg(d('about'),d('aboutL'),sec(d('hIntro'),`<p>${h(T(S.intro))}</p>`)+sec(d('hVis'),`<p>${h(T(S.vision))}</p>`)+sec(d('hMis'),`<p>${h(T(S.mission))}</p>`)+sec(d('hPrin'),`<div class="grid">${S.principles.map(p=>`<div class="card"><h3>${h(T(p))}</h3></div>`).join('')}</div>`)+sec(d('hObj'),`<ol class="obj">${S.objectives.map(o=>`<li>${h(T(o))}</li>`).join('')}</ol>`)+`<section class="wrap">${joinBand()}</section>`),
constitution:()=>pg(d('constitution'),d('consL'),sec(d('hDoc'),`<p>${d('consP')}</p><p><a class="btn" href="${h(S.constitution.pdf)}" target="_blank" rel="noopener">${d('consB')}</a></p>`)+sec(d('hCh'),`<ol class="obj" style="list-style:none;padding:0">${S.constitution.chapters.map(c=>`<li class="card" style="margin:6px 0">${h(c)}</li>`).join('')}</ol>`)),
standing:()=>pg(d('standing'),d('stL'),sec(d('hResp'),ul(S.standing.responsibilities))+`<section class="wrap">${note(d('stN'))}</section>`+sec(d('hMem'),`<div class="grid p">${S.standing.members.map((m,i)=>pcard(m.photo||`s${i+1}.jpg`,T(m.role),m.name||d('tba'),m.name?'':'?')).join('')}</div>`)+sec(d('hRel'),chart())),
executive:()=>pg(d('executive'),d('exL'),sec(d('hDet'),info())+sec(d('hMem'),cards())+sec(d('hSt'),chart())),
activities:()=>pg(d('activities'),d('acL'),sec(d('hAct'),S.activities.length?`<div class="grid a">${S.activities.map(act).join('')}</div>`:note(d('acE'))+tiles(3))+sec(d('hInit'),`<div class="grid">${S.categories.map(c=>`<div class="card"><h3>${h(T(c))}</h3></div>`).join('')}</div>`)),
members:()=>pg(d('members'),d('meL'),sec(d('hMem'),S.members.length?`<div class="grid p">${S.members.map(m=>pcard(m.photo||'x.jpg',T(m.role)||'',m.name)).join('')}</div>`:note(d('meE')))+`<section class="wrap">${joinBand()}</section>`),
announcements:()=>pg(d('announcements'),d('anL'),sec(d('hAnn'),S.announcements.length?`<div class="grid">${S.announcements.map(a=>`<div class="card"><small>${when(a.date)}</small><h3>${h(T(a.title))}</h3><p>${h(T(a.text))}</p></div>`).join('')}</div>`:note(d('noAnn')))),
gallery:()=>pg(d('gallery'),d('gaL'),sec(d('gallery'),S.gallery.length?`<div class="grid a gal">${S.gallery.map(g=>`<figure style="margin:0"><img src="${h(g.src)}" alt="${h(T(g.caption)||'')}" loading="lazy"><figcaption class="muted">${h(T(g.caption)||'')}</figcaption></figure>`).join('')}</div>`:`<p class="muted">${d('gaP')}</p>`+tiles(6))),
contact:()=>pg(d('contact'),d('coL'),sec(d('hGet'),`<p><b>${h(S.name)} (${h(S.bn)})</b><br>${h(T(S.place))}<br>Email: <a href="mailto:${h(S.email)}">${h(S.email)}</a></p><form id="cf"><div><label for="n">${d('fN')}</label><input id="n" required></div><div><label for="e">${d('fE')}</label><input id="e" type="email" required></div><div><label for="s">${d('fS')}</label><input id="s" required></div><div><label for="m">${d('fM')}</label><textarea id="m" rows="5" required></textarea></div><button class="btn" type="submit">${d('fSend')}</button><p class="muted">${d('fNote')}</p></form>`)),
donate:()=>pg(d('donate'),d('dL'),sec(d('dT'),`<p>${d('dX')}</p><div class="band"><p>${d('dH')}</p><div>${nums()}</div><p>${d('dE')} <a href="mailto:${h(S.email)}">${h(S.email)}</a></p></div>`))
};
function chrome(){
 $('#menu').innerHTML=NAV.filter(k=>k!=='donate').map(k=>`<li><a href="#/${k}">${d(k)}</a></li>`).join('');
 $('#lg').textContent=d('lang');$('#dn').textContent='♥ '+d('donate');$('#fab').textContent='♥ '+d('donate');$('#mb').textContent=d('menu');$('#sk').textContent=d('skip');
 const j=$('#jn');j.textContent=d('join');j.href=S.joinUrl;j.target='_blank';j.rel='noopener';
 document.documentElement.lang=L;
 const f=['home','about','constitution','standing','executive','activities','gallery','contact','donate'];
 $('#foot').innerHTML=`<div class="wrap"><div><h3>${h(S.name)} (${h(S.bn)})</h3><p>${h(T(S.motto))}<br><b>${h(T(S.slogan))}</b><br>${h(T(S.place))}<br>Email: <a href="mailto:${h(S.email)}">${h(S.email)}</a></p></div><div><h3>${d('fl')}</h3><ul>${f.map(k=>`<li><a href="#/${k}">${d(k)}</a></li>`).join('')}<li><a href="${h(S.joinUrl)}" target="_blank" rel="noopener">${d('join')}</a></li></ul></div><p class="copy">© ${h(S.name)}. ${d('rights')}</p></div>`}
function go(keep){const y=scrollY,k=location.hash.replace(/^#\/?/,'')||'home',r=R[k]?k:'home';
 $('#app').innerHTML=R[r]();document.title=r==='home'?'SUHAYON — Official Website':d(r)+' | SUHAYON';
 document.querySelectorAll('#menu a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#/'+r));
 $('#nav').classList.remove('open');$('#mb').setAttribute('aria-expanded','false');scrollTo(0,keep===true?y:0);
 const f=$('#cf');if(f)f.onsubmit=e=>{e.preventDefault();const v=i=>$('#'+i).value;location.href=`mailto:${S.email}?subject=${encodeURIComponent(v('s'))}&body=${encodeURIComponent(v('m')+'\n\n— '+v('n')+' ('+v('e')+')')}`}}
$('#mb').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#mb').setAttribute('aria-expanded',o)};
$('#lg').onclick=()=>{L=L==='bn'?'en':'bn';try{localStorage.setItem('sl',L)}catch(e){}chrome();go(true)};
document.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.c;if(c&&navigator.clipboard)navigator.clipboard.writeText(c).then(()=>{e.target.textContent=d('copied')})});
chrome();addEventListener('hashchange',()=>go());go();
</script>
</body>
</html>
